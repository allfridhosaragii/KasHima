name: Build, verify and deploy KasHima
on:
  push:
    branches: [main, react-migration, clarity-v9, profile-mobile-nav-audit-v10]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and build
        run: npm run build
      - name: Run unit tests
        run: npm test
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Mobile and role smoke checks
        run: npm run test:e2e
      - name: Upload browser test evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kashima-browser-diagnostics
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - name: Upload site artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        uses: actions/deploy-pages@v4
        id: deployment
